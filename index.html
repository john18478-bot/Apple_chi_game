<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0f8ff">
<title>哈利的花毛衣｜閱讀大挑戰</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f0f8ff;color:#1f2937}.app{min-height:100vh;padding:32px 16px;display:flex;align-items:center;justify-content:center}.wrap{width:100%;max-width:768px;margin:auto}.center{text-align:center}.fade{animation:fadeIn .4s ease-out}.emoji{font-size:64px;margin-bottom:16px}.title{font-size:44px;line-height:1.15;font-weight:800;color:#1e40af;margin:0 0 28px}.tip{font-size:20px;color:#374151;background:#fef9c3;padding:16px;border-radius:16px;border:2px solid #fde047;box-shadow:0 2px 5px rgba(0,0,0,.08);display:inline-block;line-height:1.5}.btn{border:0;cursor:pointer;font-weight:700;transition:.2s;box-shadow:0 6px 14px rgba(0,0,0,.15)}.btn:active{transform:scale(.96)}.start-btn{margin-top:28px;padding:16px 32px;border-radius:999px;background:#22c55e;color:#fff;font-size:24px}.start-btn:hover{background:#16a34a}.topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 16px;border-radius:16px;border:2px solid #f3f4f6;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px;font-size:18px;font-weight:700;color:#6b7280}.blue{color:#2563eb;font-size:20px}.orange{color:#f97316;font-size:20px}.question{position:relative;background:#eff6ff;padding:28px;border-radius:24px;border:4px solid #bfdbfe;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:24px}.question h2{font-size:29px;line-height:1.55;margin:0;padding-right:42px}.qnum{color:#2563eb;margin-right:8px}.speaker{width:52px;height:52px;border-radius:999px;background:#facc15;color:#713f12;border:2px solid #fff;position:absolute;right:16px;top:16px;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.12)}.option-row{display:flex;gap:8px;margin-bottom:16px}.option-speak{width:56px;flex:0 0 56px;border-radius:16px;background:#fef9c3;color:#a16207;border:2px solid #fde68a;font-size:24px}.option{flex:1;text-align:left;padding:16px;border-radius:16px;border:2px solid #e5e7eb;background:#fff;color:#374151;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 5px rgba(0,0,0,.06)}.option:hover{background:#f9fafb}.option.selected{background:#dbeafe;border-color:#60a5fa;color:#1e40af;box-shadow:0 0 0 2px #60a5fa inset}.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534;box-shadow:0 0 0 2px #22c55e inset}.option.wrong{background:#fee2e2;border-color:#f87171;color:#991b1b}.option.dim{background:#f9fafb;border-color:#e5e7eb;color:#9ca3af;opacity:.65}.controls{height:64px;display:flex;justify-content:center;align-items:center;margin-top:24px}.confirm,.next,.again{padding:12px 32px;border-radius:999px;color:#fff;font-size:20px}.confirm{background:#2563eb}.confirm:hover{background:#1d4ed8}.next{background:#22c55e}.next:hover{background:#16a34a}.end-card{background:#fff;padding:32px;border-radius:24px;border:4px solid #bfdbfe;box-shadow:0 8px 20px rgba(0,0,0,.12);max-width:448px;margin:0 auto}.end-card .label{font-size:24px;color:#6b7280}.score{font-size:56px;font-weight:900;color:#2563eb;margin:8px 0 16px}.message{font-size:20px;color:#ea580c;font-weight:600}.again{background:#3b82f6;margin-top:24px}.again:hover{background:#2563eb}.hidden{display:none!important}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:640px){.app{padding:20px 12px}.title{font-size:36px}.question{padding:22px 18px}.question h2{font-size:24px}.speaker{right:-6px;top:-18px}.option{font-size:18px}.tip{font-size:18px}}
</style>
</head>
<body>
<div class="app"><div id="root" class="wrap"></div></div>
<script>
const QUIZ_DATA = [
{id:1,question:"「斑點狗哈利生日那天，外婆送牠一件編織了許多玫瑰花圖案的毛衣。」句子中「編織」是什麼意思？",options:["用剪刀把布料剪開拼貼。","用線或毛線互相交錯結合成物品。","用顏色筆在衣服上畫畫。"],correctAnswer:"用線或毛線互相交錯結合成物品。"},
{id:2,question:"哈利為什麼不喜歡外婆送的第一件毛衣？",options:["因為毛衣太小不合身。","因為毛衣穿起來不夠暖和。","因為毛衣上面有玫瑰花圖案。"],correctAnswer:"因為毛衣上面有玫瑰花圖案。"},
{id:3,question:"「毛衣十分合身，可是哈利並不喜歡。」句子中的「合身」是什麼意思？",options:["衣服的大小穿在身上非常合適。","衣服穿在身上覺得非常緊。","衣服的顏色非常好看。"],correctAnswer:"衣服的大小穿在身上非常合適。"},
{id:4,question:"在跳蚤市場，哈利把毛衣藏在攤位裡，結果發生了什麼事？",options:["成功藏在玩具攤位，沒有人發現。","被其他小狗偷偷叼走了。","被路人發現並把毛衣交還給牠。"],correctAnswer:"被路人發現並把毛衣交還給牠。"},
{id:5,question:"「把毛衣交還給牠」句子中的「交還」是什麼意思？",options:["將物品退回或歸還給原來的主人。","把自己的東西借給別人使用。","不小心把東西弄不見了。"],correctAnswer:"將物品退回或歸還給原來的主人。"},
{id:6,question:"「哈利沒有心情和孩子玩，獨個兒在院子裡悶悶不樂地坐著。」句子中的「悶悶不樂」用來形容什麼心情？",options:["非常開心，想要跳舞的樣子。","心裡不高興，獨自發愁的樣子。","非常生氣，想要大聲叫的樣子。"],correctAnswer:"心裡不高興，獨自發愁的樣子。"},
{id:7,question:"哈利的玫瑰花毛衣最後是怎麼消失的？",options:["掉進河裡被水慢慢沖走了。","被外婆拿回去重新織過。","毛線被小鳥咬住飛上天，毛衣慢慢消失了。"],correctAnswer:"毛線被小鳥咬住飛上天，毛衣慢慢消失了。"},
{id:8,question:"「哈利心花怒放，牠追著小鳥，一邊跑，一邊叫。」句子中的「心花怒放」是什麼意思？",options:["形容非常開心，高興到了極點。","形容心裡很害怕，不知所措。","形容花園裡的花朵開得很漂亮。"],correctAnswer:"形容非常開心，高興到了極點。"},
{id:9,question:"為什麼鳥窩看起來和哈利的毛衣很「相似」？",options:["因為鳥窩剛好掉在哈利的毛衣上。","因為小鳥用哈利毛衣的毛線築成了鳥窩。","因為外婆也幫小鳥織了一個鳥窩。"],correctAnswer:"因為小鳥用哈利毛衣的毛線築成了鳥窩。"},
{id:10,question:"哈利為什麼喜歡聖誕節外婆送的新毛衣？",options:["因為毛衣既暖和又合身，而且是一件有黑點的白毛衣。","因為上面有牠最喜歡的骨頭圖案。","因為這件毛衣是紅色的，非常有聖誕氣氛。"],correctAnswer:"因為毛衣既暖和又合身，而且是一件有黑點的白毛衣。"}
];
let gameState='start', currentQuestionIndex=0, score=0, selectedOption=null, isAnswerChecked=false, shuffledOptions=[];
const root=document.getElementById('root');
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speakText(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();if(!text)return;const u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=.85;u.pitch=1.1;window.speechSynthesis.speak(u);}
function startGame(){gameState='playing';currentQuestionIndex=0;score=0;selectedOption=null;isAnswerChecked=false;shuffledOptions=shuffle(QUIZ_DATA[0].options);render();}
function chooseOption(i){if(isAnswerChecked)return;selectedOption=shuffledOptions[i];render();}
function checkAnswer(){if(!selectedOption)return;isAnswerChecked=true;const ok=selectedOption===QUIZ_DATA[currentQuestionIndex].correctAnswer;if(ok){score+=10;speakText('答啱啦！你好叻呀！');}else{speakText('唔緊要，下次再努力！');}render();}
function nextQuestion(){if('speechSynthesis' in window)window.speechSynthesis.cancel();if(currentQuestionIndex<QUIZ_DATA.length-1){currentQuestionIndex++;selectedOption=null;isAnswerChecked=false;shuffledOptions=shuffle(QUIZ_DATA[currentQuestionIndex].options);}else gameState='end';render();}
function renderStart(){root.innerHTML=`<section class="center fade"><div class="emoji">🐶🧥</div><h1 class="title">哈利的花毛衣<br>閱讀大挑戰</h1><div class="tip">點擊旁邊的 🔊 喇叭按鈕，<br>可以聽廣東話朗讀喔！</div><br><button class="btn start-btn" onclick="startGame()">▶ 開始遊戲</button></section>`;}
function renderEnd(){let message='',emoji='';if(score===100){message='太棒了！你是全對的閱讀小天才！';emoji='🏆✨';}else if(score>=70){message='表現得很好！繼續保持喔！';emoji='🌟👏';}else{message='再接再厲！你可以再試一次！';emoji='💪📖';}root.innerHTML=`<section class="center fade"><div class="emoji">${emoji}</div><h2 style="font-size:36px;margin:0 0 24px">測驗結束！</h2><div class="end-card"><div class="label">你的總得分</div><div class="score">${score} / 100</div><div class="message">${message}</div></div><button class="btn again" onclick="startGame()">↻ 再玩一次</button></section>`;}
function renderPlaying(){const q=QUIZ_DATA[currentQuestionIndex];const opts=shuffledOptions.map((o,i)=>{let cls='option';let icon='';if(isAnswerChecked){if(o===q.correctAnswer){cls+=' correct';icon='✓';}else if(o===selectedOption){cls+=' wrong';icon='✕';}else cls+=' dim';}else if(o===selectedOption)cls+=' selected';return `<div class="option-row"><button class="btn option-speak" onclick='speakText(${JSON.stringify(o)})' title="朗讀選項">🔊</button><button class="btn ${cls}" onclick="chooseOption(${i})" ${isAnswerChecked?'disabled':''}><span>${escapeHtml(o)}</span><span style="font-size:26px;margin-left:12px">${icon}</span></button></div>`;}).join('');root.innerHTML=`<section class="fade"><div class="topbar"><div>題數：<span class="blue">${currentQuestionIndex+1}</span> / ${QUIZ_DATA.length}</div><div>積分：<span class="orange">🦴 ${score}</span></div></div><div class="question"><button class="btn speaker" onclick='speakText(${JSON.stringify(q.question)})' title="朗讀題目">🔊</button><h2><span class="qnum">Q${currentQuestionIndex+1}.</span>${escapeHtml(q.question)}</h2></div><div>${opts}</div><div class="controls">${!isAnswerChecked&&selectedOption?'<button class="btn confirm" onclick="checkAnswer()">確定答案</button>':''}${isAnswerChecked?`<button class="btn next" onclick="nextQuestion()">${currentQuestionIndex<QUIZ_DATA.length-1?'下一題 ➔':'查看成績 🏆'}</button>`:''}</div></section>`;}
function render(){if(gameState==='start')renderStart();else if(gameState==='playing')renderPlaying();else renderEnd();}
window.addEventListener('beforeunload',()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel();});
render();
</script>
</body>
</html>
